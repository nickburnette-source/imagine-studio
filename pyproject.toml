[project]
name = "rally-builder"
version = "0.1.0"
description = "Local GUI for gated DutyCall Rally skin generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
    "httpx>=0.27.0",
    "xai-sdk>=1.0.0",
    "boto3>=1.34.0",
]

[project.scripts]
rally-builder = "app.main:main"
content-store = "content_store.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "content_store*"]
